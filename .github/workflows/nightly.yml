# The same repo, the same package.json, four different outcomes.
#   floating  -> what most pipelines do: no lockfile, caret range, scripts on
#   pinned    -> LOCK: npm ci from the committed lockfile
#   cooldown  -> WAIT: no lockfile, same range, but releases younger than 15 min are invisible
#                (demo window; in real life use min-release-age=3, i.e. 3 days)
#   hardened  -> LOCK + no install scripts + lockfile-lint + egress allowlist
#
# npm hides dependency install-script output, so every job checks for the
# evidence file demo-utils 1.1.0 writes. That file is the proof for the screenshots.
name: Nightly Build

on:
  workflow_dispatch:

permissions: {}            # nothing by default; each job asks for what it needs

jobs:
  floating:
    name: "install - floating (npm install, no lockfile)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@nedkohristov"
      - name: Resolve whatever the range allows
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f package-lock.json
          npm install
          npm ls @nedkohristov/demo-utils
      - name: Did anything run during install?
        run: |
          if [ -f demo-utils-was-here.txt ]; then cat demo-utils-was-here.txt; else echo "Nothing ran. Clean install."; fi
      - run: npm start

  pinned:
    name: "install - pinned (npm ci, committed lockfile)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@nedkohristov"
      - name: Install exactly what the lockfile says
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm ls @nedkohristov/demo-utils
      - name: Did anything run during install?
        run: |
          if [ -f demo-utils-was-here.txt ]; then cat demo-utils-was-here.txt; else echo "Nothing ran. Clean install."; fi
      - run: npm start

  cooldown:
    name: "install - cooldown (no lockfile, skip releases < 15 min old)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@nedkohristov"
      - name: Same range as "floating", but fresh releases are invisible
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f package-lock.json
          # Demo window: 15 minutes. Real life: min-release-age=3 (days). Same mechanism.
          npm install --before="$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          npm ls @nedkohristov/demo-utils
      - name: Did anything run during install?
        run: |
          if [ -f demo-utils-was-here.txt ]; then cat demo-utils-was-here.txt; else echo "Nothing ran. Clean install."; fi
      - run: npm start

  hardened:
    name: "install - hardened (lock, no scripts, egress allowlist)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Default-deny egress
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            npm.pkg.github.com:443
            pkg-npm.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@nedkohristov"
      - name: INSPECT - lockfile only points where we allow
        run: npx --yes lockfile-lint --path package-lock.json --allowed-hosts npm npm.pkg.github.com --validate-https
      - name: LOCK + no install scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --ignore-scripts
          npm ls @nedkohristov/demo-utils
      - name: Did anything run during install?
        run: |
          if [ -f demo-utils-was-here.txt ]; then cat demo-utils-was-here.txt; else echo "Nothing ran. Clean install."; fi
      - run: npm start
