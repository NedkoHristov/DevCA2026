# Finding 2 fix - "the credential outlived its owner".
# No DEPLOY_TOKEN secret exists. The job gets a credential that expires in 15 minutes,
# only from this repo, only in the protected "production" environment.
name: Deploy (OIDC)
on: workflow_dispatch
permissions: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production        # add required reviewers on this environment
    permissions:
      contents: read
      id-token: write              # the only extra grant: ask for an OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/devca2026-deploy
          aws-region: eu-central-1
          role-duration-seconds: 900
      - run: aws sts get-caller-identity
