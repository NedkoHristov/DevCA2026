# pnpm 11 already defaults to minimumReleaseAge: 1440 (1 day) and blockExoticSubdeps: true.
# Make it explicit and stricter. Unit: MINUTES (npm uses days - say it on stage).
minimumReleaseAge: 4320          # 3 days
minimumReleaseAgeExclude:
  - "@nedkohristov/*"                   # internal packages can update immediately
blockExoticSubdeps: true         # no git/tarball URLs smuggled in by transitive deps
