# Local npm registry for the stage demo. Works fully offline.
storage: ./storage
auth:
  htpasswd:
    file: ./htpasswd
    max_users: 10
packages:
  '@demo/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  '**':
    access: $all
listen: 127.0.0.1:4873
log: { type: stdout, format: pretty, level: warn }
